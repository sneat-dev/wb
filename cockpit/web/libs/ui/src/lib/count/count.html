<a
  #link
  class="count-link"
  [routerLink]="target()"
  [queryParams]="query()"
  [attr.aria-label]="count() + ' ' + label()"
  [attr.aria-describedby]="cardId"
  >{{ count() }}</a
>
<span
  class="count-card"
  role="tooltip"
  [id]="cardId"
  [class.open]="open()"
  [style.left.px]="position().left"
  [style.top.px]="position().top ?? null"
  [style.bottom.px]="position().bottom ?? null"
>
  <strong>{{ count() }} {{ label() }}</strong>
  @if (shown().length) {
    <ul>
      @for (name of shown(); track $index) {
        <li>{{ name }}</li>
      }
    </ul>
  }
  @if (more() > 0) {
    <span class="count-more">and {{ more() }} more</span>
  }
</span>
