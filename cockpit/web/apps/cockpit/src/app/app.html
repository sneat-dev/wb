<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">Skip to the page</a>
<app-top-bar />
<main id="main" class="shell-main" tabindex="-1" #main>
  <h1 class="visually-hidden">{{ pageTitle() }}</h1>
  <app-fleet-banner />
  @if (store.schemaMismatch(); as mismatch) {
    <app-schema-mismatch [mismatch]="mismatch" />
  } @else {
    @if (store.loaded()) {
      <!-- Hidden until the first page has been routed to (its code is a lazy chunk), so that nothing that is on screen moves when it arrives. -->
      <div class="page-slot" [hidden]="!pageShown()">
        <router-outlet (activate)="pageShown.set(true)" />
      </div>
      @if (pageShown() && store.warmingUp()) {
        <app-skeleton-rows class="warming" [count]="6" />
      }
    }
    @if (!store.loaded() || !pageShown()) {
      <app-skeleton-rows class="loading" [count]="6" />
    }
  }
</main>
<ng-container #overlays />
