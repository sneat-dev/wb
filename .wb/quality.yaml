version: 1

go_lint:
  commands:
    - [go, vet, ./...]
    - [go, run, "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@1b907273167eec8b3d84cae636b7798ced4433d5", run, ./...]
    # Reachability: every mechanism must have a caller on a path that runs.
    # A missing feature is loud; a present-but-unwired one is silent, and no
    # other check here sees it — a test is itself a caller, so tests hide it.
    # Existing findings are tolerated through .wb/deadcode-baseline.txt, so
    # this only fails on a function that became unreachable in this change.
    - [go, run, ./cmd/wb, deadcode]

go_test:
  shards: 4
  packages:
    # These packages are safe to split by top-level test. cmd/wb contains
    # real-clock and process-global journeys and stays in the single
    # unsharded job to avoid multiplying its setup cost.
    - ./internal/worktrees
    # internal/orchestrate is over 15 minutes of the unsharded job by
    # itself, the single largest remaining win in coverage-job latency
    # (#578). Adding it here was tried once before and reverted because
    # `wb coverage` failed in the profile-merge/report step after every
    # shard succeeded, and commandError preferring command output over the
    # underlying error masked the real cause; that was fixed by #575
    # (a5f3ea091e19). This re-enables it on that basis; the sharded
    # `wb coverage` run itself is unverified here and is proved (or not) by
    # this change's own CI coverage job.
    - ./internal/orchestrate
