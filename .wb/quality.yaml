version: 1

go_lint:
  commands:
    - [go, vet, ./...]
    - [go, run, "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@1b907273167eec8b3d84cae636b7798ced4433d5", run, ./...]

go_test:
  shards: 4
  packages:
    # This package is safe to split by top-level test. cmd/wb and
    # internal/orchestrate contain real-clock and process-global journeys and
    # stay in the single unsharded job to avoid multiplying their setup cost.
    - ./internal/worktrees
