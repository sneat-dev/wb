name: Nightly coverage

# Full-module coverage is the daily repository-wide floor and artifact producer.
# Pull-request coverage uses a selected scope; its profile cannot establish a
# repository-wide percentage or serve as a full-module baseline.

on:
  schedule:
    # 03:00 UTC daily, off the working peak for this fleet.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A nightly run is never worth queueing behind another nightly run.
  group: nightly-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Full merged coverage (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Matches go-ci.yml's coverage budget: internal/orchestrate joined the
    # sharded package list in #578 (it was over 15 minutes unsharded), and
    # the raised budget stays regardless so setup and diagnostic upload
    # remain outside the inner deadline.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Resolve measured revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with merged coverage threshold
        run: >-
          go run ./cmd/wb coverage .
          --include-e2e
          --coverage-profile profile.cov
          --report-dir coverage-diagnostics
          --minimum=94
          --format json
          --non-interactive
          --timeout 35m

      - name: Upload coverage diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-nightly-coverage-diagnostics
          path: coverage-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-nightly-go-coverage
          path: profile.cov
          if-no-files-found: error
          # Kept longer than go-ci's copy: this is the series a coverage trend
          # is read from, and the pull-request profiles are transient.
          retention-days: 30

      - name: Publish full-module per-package coverage baseline
        run: go run ./cmd/wb coverage baseline profile.cov --module . --sha "${{ steps.revision.outputs.sha }}" --include-e2e --out coverage-baseline.json

      - name: Upload full-module coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-coverage-baseline
          path: coverage-baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish full-module coverage summary
        run: >-
          go run ./cmd/wb coverage summary profile.cov
          --module .
          --repo "${{ github.repository }}"
          --sha "${{ steps.revision.outputs.sha }}"
          --ref refs/heads/main
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --out coverage-summary.json

      - name: Upload full-module coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-coverage-summary
          path: coverage-summary.json
          if-no-files-found: error
          retention-days: 90
