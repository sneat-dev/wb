name: Deploy website to Cloudflare

# Production-only workflow for wb.sneat.dev. Pull requests are validated by the
# website build check and never enter this workflow; it deploys on every
# relevant push to main. Self-contained (no cross-org reusable workflow) so it
# runs regardless of the sneat-dev org Actions allowlist: only GitHub-authored
# actions (checkout, setup-node) plus `wrangler deploy` via the website's own
# devDependency. Mirrors sneat-dev/website's deploy.yml.
#
# Requires: repo/org secret CLOUDFLARE_API_TOKEN reaching this PUBLIC repo
# (an org secret with "private" visibility does not) and the
# CLOUDFLARE_ACCOUNT_ID repository variable.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-website.yml"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production deploy (wb.sneat.dev)
    # workflow_dispatch exposes a branch selector; never let a manually
    # selected feature branch reach the production Cloudflare worker.
    if: github.ref == 'refs/heads/main'
    environment:
      name: website-production
      url: https://wb.sneat.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy (wrangler)
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -e
          for route in / /install/get-cli; do
            code=000
            for attempt in {1..10}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://wb.sneat.dev${route}")
              echo "wb.sneat.dev${route} -> ${code} (attempt ${attempt}/10)"
              if [ "$code" = "200" ]; then
                break
              fi
              if [ "$attempt" -lt 10 ]; then
                sleep 3
              fi
            done
            [ "$code" = "200" ] || { echo "::error::wb.sneat.dev${route} returned ${code} after 10 attempts"; exit 1; }
          done
