name: Go CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # A newer PR revision supersedes its older validation. Main/tag runs may
  # publish, so they must never cancel an in-progress release.
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-scope:
    name: Decide native Windows coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            required:
              - '**/*_windows.go'
              - 'cmd/wb/**'
              - 'internal/session/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/go-ci.yml'

  validation-reuse:
    name: Decide validation reuse
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
      reason: ${{ steps.verify.outputs.reason }}
    steps:
      - name: Checkout landed source
        uses: actions/checkout@v6
      - name: Select an exact trusted pull-request receipt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-reuse-select.sh "$GITHUB_OUTPUT"
      - name: Download selected validation receipt
        if: steps.select.outputs.candidate == 'true'
        # An expired or transiently unavailable artifact must take the ordinary
        # full-validation path; it is not an authorization failure.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: wb-ci-validation-receipt
          run-id: ${{ steps.select.outputs.run_id }}
          path: .ci-validation-receipt
          github-token: ${{ github.token }}
      - name: Verify selected validation receipt
        id: verify
        env:
          CI_REUSE_RUN_ID: ${{ steps.select.outputs.run_id }}
          CI_REUSE_PULL_NUMBER: ${{ steps.select.outputs.pull_number }}
          CI_REUSE_HEAD_SHA: ${{ steps.select.outputs.head_sha }}
        run: >-
          .github/scripts/ci-reuse-verify.sh "$GITHUB_OUTPUT"
          .ci-validation-receipt/ci-validation-receipt.json

  release-eligibility:
    name: Determine release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      # Resolve publication policy first. An ineligible PR still runs all
      # validation jobs; only publication depends on the eligible output.
      - name: Checkout eligibility source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine eligible publication ref
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          .github/scripts/release-eligible.sh "$EVENT_NAME" "$REF" "$BEFORE" "$SHA" >> "$GITHUB_OUTPUT"

  source:
    name: Check formatting and dependencies
    needs: [release-eligibility, validation-reuse]
    if: github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check Go formatting (read-only)
        run: |
          set -eu
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$OUT"
            exit 1
          fi

  static:
    name: Build and vet
    needs: [release-eligibility, validation-reuse]
    if: github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  lint:
    name: Lint (golangci-lint)
    needs: [release-eligibility, validation-reuse]
    if: github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.12.2's analysis dependencies panic on Go 1.27's
          # embedded-selector literals. Pin upstream source with the fixes
          # until a compatible golangci-lint release lands.
          version: 1b907273167eec8b3d84cae636b7798ced4433d5
          install-mode: goinstall

  coverage:
    name: Tests and coverage (8 shards)
    needs: [release-eligibility, validation-reuse]
    if: github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # The merged package set uses real repositories and worktrees. Keep the
    # command below bounded, but leave enough room for runner variance as the
    # integration suite grows.
    # The inner command bounds test execution at 7m30s. Keep setup and failure
    # diagnostic upload outside that budget so a timeout still leaves evidence.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with merged coverage threshold
        run: >-
          go run ./cmd/wb coverage .
          --test-shards 8
          --shard-package ./internal/worktrees
          --coverage-profile profile.cov
          --report-dir coverage-diagnostics
          --minimum=58
          --format json
          --non-interactive
          --timeout 7m30s
      - name: Upload coverage diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: wb-coverage-diagnostics
          path: coverage-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: wb-go-coverage
          path: profile.cov
          if-no-files-found: error
          retention-days: 14

  race:
    name: Race tests
    needs: [release-eligibility, validation-reuse]
    if: github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The development VMs this repository is usually written on have no C
      # compiler, so -race cannot run there; this shard is the fleet's only
      # data-race gate. It is scoped to the packages that run in-process
      # worker pools and shared observers rather than the whole module, so
      # the gate stays fast enough to sit in the required aggregate below.
      # Orchestration tests create real repositories and worktrees; under the
      # race detector their package can legitimately exceed Go's default 10m
      # timeout while remaining within this job's 20m bound.
      - name: go test -race (concurrency-bearing packages)
        run: >-
          go test -race -timeout 15m
          ./internal/deps/...
          ./internal/githubobserver/...
          ./internal/fleetsync/...

  windows:
    name: Native Windows compile and test
    needs: [windows-scope, validation-reuse]
    if: >-
      needs.windows-scope.outputs.required == 'true' &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile all Go packages for Windows
        run: go build ./...
      - name: Test Windows-safe portability primitives
        run: >-
          go test ./internal/session
          -run '^TestLookupExactRefusesLinkedRecordsAndRequiresLivePID$'

  test:
    # This job only combines results. Keep its name aligned with the required
    # status check in branch protection when changing it.
    name: Required checks passed
    if: ${{ always() }}
    needs: [release-eligibility, validation-reuse, source, static, lint, coverage, race, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize required check results (no build or tests)
        env:
          ELIGIBILITY_RESULT: ${{ needs.release-eligibility.result }}
          REUSE_RESULT: ${{ needs.validation-reuse.outputs.reuse }}
          REUSE_JOB_RESULT: ${{ needs.validation-reuse.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RACE_RESULT: ${{ needs.race.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -eu
          if [ "$REUSE_JOB_RESULT" != "success" ]; then
            echo "Validation reuse decision concluded: $REUSE_JOB_RESULT" >&2
            exit 1
          fi
          if [ "$REUSE_RESULT" = "true" ]; then
            expected=skipped
          else
            expected=success
          fi
          for check in "Eligibility:$ELIGIBILITY_RESULT" "Formatting and dependencies:$SOURCE_RESULT" "Build and vet:$STATIC_RESULT" "Lint:$LINT_RESULT" "Tests and coverage:$COVERAGE_RESULT" "Race tests:$RACE_RESULT"; do
            name=${check%%:*}
            result=${check#*:}
            if [ "$name" = "Eligibility" ]; then
              expected_for_check=success
            else
              expected_for_check=$expected
            fi
            if [ "$result" != "$expected_for_check" ]; then
              echo "Required check '$name' concluded: $result; expected $expected_for_check" >&2
              exit 1
            fi
          done
          if [ "$WINDOWS_RESULT" != "success" ] && [ "$WINDOWS_RESULT" != "skipped" ]; then
            echo "Required check 'Native Windows compile and test' concluded: $WINDOWS_RESULT" >&2
            exit 1
          fi
          if [ "$REUSE_RESULT" = "true" ]; then
            echo "Reused exact trusted pull-request validation."
          else
            echo "All required checks passed. This job only combines their results."
          fi

  validation-receipt:
    name: Publish validation receipt
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
      - name: Write exact validation receipt
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/ci-reuse-receipt.sh ci-validation-receipt.json
      - name: Upload validation receipt
        uses: actions/upload-artifact@v7
        with:
          name: wb-ci-validation-receipt
          path: ci-validation-receipt.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: >-
      ${{
        !cancelled() &&
        needs.test.result == 'success' &&
        needs.release-eligibility.result == 'success' &&
        needs.release-eligibility.outputs.eligible == 'true'
      }}
    needs: [test, release-eligibility]
    # Serialize publication without cancelling a signing/notarization run.
    concurrency:
      group: wb-release-${{ github.ref }}
      cancel-in-progress: false
    # Resolve smoke-test metadata alongside the artifact build, then verify
    # published artifacts and Homebrew installs in parallel after promotion.
    uses: strongo/cicd/.github/workflows/release.yml@19adc5f9e479df1861aea3ee9e1037c746628e4c
    permissions:
      contents: write
    with:
      go_version: '1.27'
      allow_major_version_bump: false
      # A CLI-changing merge without a conventional terminal title must still
      # produce a patch release.
      default_bump: patch
      require_notarized_macos: true
    secrets:
      GORELEASER_GITHUB_TOKEN: ${{ secrets.WB_GORELEASER_GITHUB_TOKEN }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
