name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Tidy, format, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: gofmt
        run: |
          set -eu
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$OUT"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.12.2's analysis dependencies panic on Go 1.27's
          # embedded-selector literals. Pin upstream source with the fixes
          # until a compatible golangci-lint release lands.
          version: 1b907273167eec8b3d84cae636b7798ced4433d5
          install-mode: goinstall

  coverage:
    name: Sharded coverage
    runs-on: ubuntu-latest
    # The merged package set uses real repositories and worktrees. Keep the
    # command below bounded, but leave enough room for runner variance as the
    # integration suite grows.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with merged coverage threshold
        run: >-
          go run ./cmd/wb coverage .
          --test-shards 8
          --shard-package ./internal/worktrees
          --shard-package ./internal/orchestrate
          --coverage-profile profile.cov
          --minimum=58
          --format json
          --non-interactive
          --timeout 7m30s
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: wb-go-coverage
          path: profile.cov
          if-no-files-found: error
          retention-days: 14

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The development VMs this repository is usually written on have no C
      # compiler, so -race cannot run there; this shard is the fleet's only
      # data-race gate. It is scoped to the packages that run in-process
      # worker pools and shared observers rather than the whole module, so
      # the gate stays fast enough to sit in the required aggregate below.
      # Orchestration tests create real repositories and worktrees; under the
      # race detector their package can legitimately exceed Go's default 10m
      # timeout while remaining within this job's 20m bound.
      - name: go test -race (concurrency-bearing packages)
        run: >-
          go test -race -timeout 15m
          ./internal/deps/...
          ./internal/orchestrate/...
          ./internal/githubobserver/...
          ./internal/fleetsync/...

  test:
    name: Build, vet, test
    if: ${{ always() }}
    needs: [static, lint, coverage, race]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every parallel Go gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          set -eu
          for result in "$STATIC_RESULT" "$LINT_RESULT" "$COVERAGE_RESULT" "$RACE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required parallel Go gate concluded: $result" >&2
              exit 1
            fi
          done
