name: Go CI

on:
  push:
    # cov/integration: the coverage programme's integration branch
    # (spec/plans/coverage-to-100 decision 21). Its pushes publish the
    # coverage baseline its PRs' ratchet fetches; they are never
    # release-eligible (.github/scripts/release-eligible.sh).
    branches: [main, cov/integration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # A newer PR revision supersedes its older validation. Main/tag runs may
  # publish, so they must never cancel an in-progress release.
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-scope:
    name: Decide Go validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      required: ${{ steps.decide.outputs.required }}
    steps:
      # Everything Go builds, embeds or reads in tests from its own paths. A
      # pull request that touches none of it (spec/, docs/ prose, hub/web
      # sources, …) skips Go validation and runs only go-contract-inputs, which
      # covers the inputs no path list can: spec/ files named by
      # ai/capabilities.json, agents/ prose, and every tracked file name that
      # enters the Go module archive. Only pull requests are scoped, and a
      # scoped run publishes no validation receipt, so the merge to main always
      # validates in full.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            required:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'vendor/**'
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'ai/**'
              - 'agents/**'
              - 'skills'
              - 'hub/web/dist/**'
              - 'proto/**'
              - 'examples/**'
              - '.wb/**'
              - '.github/**'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - 'docs/cli-flag-matrix.md'
              - 'README.md'
              - '.goreleaser.yml'
              - '.golangci.*'
              - '.gitattributes'
      - name: Decide
        id: decide
        if: github.event_name == 'pull_request'
        env:
          FILTERED: ${{ steps.changes.outputs.required }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -eu
          case "$FILTERED" in
            true|false) ;;
            *) echo "Go scope filter returned '$FILTERED', want true or false" >&2; exit 1 ;;
          esac
          # GitHub lists at most 3000 files of a pull request; beyond that the
          # filter cannot see every path, so validate.
          if [ "$FILTERED" = true ] || [ "$CHANGED_FILES" -ge 3000 ]; then
            echo required=true >> "$GITHUB_OUTPUT"
          else
            echo required=false >> "$GITHUB_OUTPUT"
          fi

  go-contract-inputs:
    name: Check non-Go contract inputs
    needs: go-scope
    if: github.event_name == 'pull_request' && needs.go-scope.outputs.required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test the Go contracts over non-Go files
        run: >-
          go test ./cmd/wb -count=1
          -run '^(TestModuleArchiveIncludesCmdWBEmbedInputs|TestCapabilityManifestKeepsImplementationHelpAndSkillsInOne|TestWBMergeSkillIsOnePortableContract)$'

  windows-scope:
    name: Decide native Windows coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            required:
              - '**/*_windows.go'
              - 'cmd/wb/**'
              - 'api/githubapp/**'
              - 'internal/session/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/go-ci.yml'

  validation-reuse:
    name: Decide validation reuse
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
      reason: ${{ steps.verify.outputs.reason }}
    steps:
      - name: Checkout landed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Select an exact trusted pull-request receipt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-reuse-select.sh "$GITHUB_OUTPUT"
      - name: Download selected validation receipt
        if: steps.select.outputs.candidate == 'true'
        # An expired or transiently unavailable artifact must take the ordinary
        # full-validation path; it is not an authorization failure.
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wb-ci-validation-receipt
          run-id: ${{ steps.select.outputs.run_id }}
          path: .ci-validation-receipt
          github-token: ${{ github.token }}
      - name: Verify selected validation receipt
        id: verify
        env:
          CI_REUSE_RUN_ID: ${{ steps.select.outputs.run_id }}
          CI_REUSE_PULL_NUMBER: ${{ steps.select.outputs.pull_number }}
          CI_REUSE_HEAD_SHA: ${{ steps.select.outputs.head_sha }}
        run: >-
          .github/scripts/ci-reuse-verify.sh "$GITHUB_OUTPUT"
          .ci-validation-receipt/ci-validation-receipt.json

  release-eligibility:
    name: Determine release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      # Resolve publication policy first. An ineligible PR still runs all
      # validation jobs; only publication depends on the eligible output.
      - name: Checkout eligibility source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Determine eligible publication ref
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          .github/scripts/release-eligible.sh "$EVENT_NAME" "$REF" "$BEFORE" "$SHA" >> "$GITHUB_OUTPUT"

  source:
    name: Check formatting and dependencies
    needs: [release-eligibility, validation-reuse, go-scope]
    if: >-
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true') &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check Go formatting (read-only)
        run: |
          set -eu
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$OUT"
            exit 1
          fi

  static:
    name: Build and vet
    needs: [release-eligibility, validation-reuse, go-scope]
    if: >-
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true') &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  lint:
    name: Lint (golangci-lint)
    needs: [release-eligibility, validation-reuse, go-scope]
    if: >-
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true') &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.12.2's analysis dependencies panic on Go 1.27's
          # embedded-selector literals. Pin upstream source with the fixes
          # until a compatible golangci-lint release lands.
          version: 1b907273167eec8b3d84cae636b7798ced4433d5
          install-mode: goinstall

  coverage:
    name: Tests and coverage (8 shards)
    needs: [release-eligibility, validation-reuse, go-scope]
    # This job is the per-change coverage ratchet's one and only baseline
    # producer (spec/plans/coverage-to-100/README.md task-3(b)): it is
    # deliberately exempt from the validation-reuse push-event skip other
    # jobs apply, so a baseline artifact is always published on every push to
    # main. That is a CI-cost choice, not a free correction — a full 8-shard
    # run now executes on every push, including ones validation-reuse would
    # otherwise have let reuse an existing result.
    if: >-
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true')
    runs-on: ubuntu-latest
    # The merged package set uses real repositories and worktrees. Keep the
    # command below bounded, but leave enough room for runner variance as the
    # integration suite grows.
    # The repository-owned .wb/quality.yaml defines every process-isolated
    # package. internal/orchestrate joined that list in #578: it was over 15
    # minutes of wall clock by itself when unsharded. The inner deadline and
    # this job budget stay at their raised size regardless, so setup and
    # failure diagnostic upload remain outside the inner budget and a timeout
    # still leaves evidence.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge-base ratchet needs full history to resolve the base
          # commit and diff against it; the eligibility job at :176 already
          # does this for the same reason.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: wb ci audit --strict against the PR base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./cmd/wb ci audit . --target "$BASE_REF" --strict --non-interactive
      - name: Fetch coverage baseline for the merge base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # --commit filters server-side by exact commit, so an old merge
          # base is still found precisely instead of falling out of a
          # branch listing's default recency window; --status success is
          # deliberately not required, since a baseline can exist even when
          # some unrelated job on that run later failed.
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow go-ci.yml \
            --commit "$BASE_SHA" --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            gh run download "$RUN_ID" --repo "${{ github.repository }}" --name wb-coverage-baseline --dir . || true
          fi
          if [ ! -f coverage-baseline.json ]; then
            echo "no published baseline artifact for merge base $BASE_SHA; wb coverage --changed will measure it directly, bounded by --baseline-timeout"
          fi
      - name: Test with merged coverage threshold
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          go run ./cmd/wb coverage .
          --coverage-profile profile.cov
          --report-dir coverage-diagnostics
          --minimum=87
          --format json
          --non-interactive
          --timeout 35m
      - name: Test with the per-change coverage ratchet
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # --baseline-timeout and --timeout bound two runs that can both
        # execute in the worst case (no published baseline artifact, so the
        # fallback measures the merge base, then the PR head is measured):
        # 15m + 20m = 35m, leaving 10m of this job's 45-minute
        # timeout-minutes for checkout, setup-go, the audit step above and
        # the diagnostics upload below (review-696 also-fix #3: 20m + 20m
        # left only 5m of headroom, so a slow shard could have the job
        # killed by GitHub instead of the ratchet failing loudly).
        run: >-
          go run ./cmd/wb coverage .
          --changed
          --target "$BASE_SHA"
          --baseline-file coverage-baseline.json
          --baseline-timeout 15m
          --timeout 20m
          --coverage-profile profile.cov
          --report-dir coverage-diagnostics
          --minimum=87
          --format json
          --non-interactive
      - name: Upload coverage diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-coverage-diagnostics
          path: coverage-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-go-coverage
          path: profile.cov
          if-no-files-found: error
          retention-days: 14
      - name: Publish per-package coverage baseline
        if: ${{ github.event_name == 'push' }}
        run: go run ./cmd/wb coverage baseline profile.cov --module . --sha "${{ github.sha }}" --out coverage-baseline.json
      - name: Upload coverage baseline artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-coverage-baseline
          path: coverage-baseline.json
          if-no-files-found: error
          retention-days: 90

  race:
    name: Race tests
    needs: [release-eligibility, validation-reuse, go-scope]
    if: >-
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true') &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # The development VMs this repository is usually written on have no C
      # compiler, so -race cannot run there; this shard is the fleet's only
      # data-race gate. It is scoped to the packages that run in-process
      # worker pools and shared observers rather than the whole module, so
      # the gate stays fast enough to sit in the required aggregate below.
      # Orchestration tests create real repositories and worktrees; under the
      # race detector their package can legitimately exceed Go's default 10m
      # timeout while remaining within this job's 20m bound.
      - name: go test -race (concurrency-bearing packages)
        run: >-
          go test -race -timeout 15m
          ./internal/deps/...
          ./internal/githubobserver/...
          ./internal/lifecyclehooks/...
          ./internal/fleetsync/...
          ./internal/runqueue/...

  windows:
    name: Native Windows compile and test
    needs: [windows-scope, validation-reuse, go-scope]
    if: >-
      needs.windows-scope.outputs.required == 'true' &&
      (github.event_name != 'pull_request' || needs.go-scope.outputs.required == 'true') &&
      (github.event_name != 'push' || needs.validation-reuse.outputs.reuse != 'true')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile all Go packages for Windows
        run: go build ./...
      - name: Test Windows-safe portability primitives
        run: >-
          go test ./internal/session
          -run '^TestLookupExactRefusesLinkedRecordsAndRequiresLivePID$'
      - name: Test lifecycle-hook Windows trust
        run: >-
          go test ./internal/lifecyclehooks
          -run '^TestWindowsTrust'
      - name: Test daemon Windows ACL consumers
        run: >-
          go test ./internal/unixcompat ./internal/archiveprune ./cmd/wb
          -run '^(TestOpenNoFollowTransfersSingleHandleOwnership|TestFstatIdentityMatchesFstatat|TestWindowsPlanUntrackedSimpleFile|TestWindowsDaemon)'
      - name: Test GitHub App provider contract
        run: go test ./api/githubapp -count=1

  test:
    # This job only combines results. Keep its name aligned with the required
    # status check in branch protection when changing it.
    name: Required checks passed
    if: ${{ always() }}
    needs: [release-eligibility, validation-reuse, go-scope, go-contract-inputs, source, static, lint, coverage, race, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize required check results (no build or tests)
        env:
          ELIGIBILITY_RESULT: ${{ needs.release-eligibility.result }}
          REUSE_RESULT: ${{ needs.validation-reuse.outputs.reuse }}
          REUSE_JOB_RESULT: ${{ needs.validation-reuse.result }}
          EVENT_NAME: ${{ github.event_name }}
          GO_SCOPE_RESULT: ${{ needs.go-scope.result }}
          GO_REQUIRED: ${{ needs.go-scope.outputs.required }}
          CONTRACT_RESULT: ${{ needs.go-contract-inputs.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RACE_RESULT: ${{ needs.race.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -eu
          if [ "$REUSE_JOB_RESULT" != "success" ]; then
            echo "Validation reuse decision concluded: $REUSE_JOB_RESULT" >&2
            exit 1
          fi
          if [ "$GO_SCOPE_RESULT" != "success" ]; then
            echo "Go validation scope decision concluded: $GO_SCOPE_RESULT" >&2
            exit 1
          fi
          spec_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$GO_REQUIRED" in
              true) ;;
              false) spec_only=true ;;
              *) echo "Go validation scope is '$GO_REQUIRED', want true or false" >&2; exit 1 ;;
            esac
          fi
          if [ "$spec_only" = "true" ]; then
            expected_contract=success
          else
            expected_contract=skipped
          fi
          if [ "$CONTRACT_RESULT" != "$expected_contract" ]; then
            echo "Required check 'Non-Go contract inputs' concluded: $CONTRACT_RESULT; expected $expected_contract" >&2
            exit 1
          fi
          if [ "$REUSE_RESULT" = "true" ] || [ "$spec_only" = "true" ]; then
            expected=skipped
          else
            expected=success
          fi
          # The coverage job is deliberately exempt from the push-event reuse
          # skip other jobs apply (it is the per-change ratchet's baseline
          # producer, .github/workflows/go-ci.yml coverage job comment): its
          # `if:` runs it on every push regardless of REUSE_RESULT, and on a
          # pull request only when go-scope requires Go validation. Mirror
          # that condition exactly here instead of reusing $expected, or a
          # push that reuses validation expects "skipped" while the job
          # actually runs and concludes "success".
          if [ "$EVENT_NAME" = "push" ]; then
            expected_coverage=success
          else
            expected_coverage=$expected
          fi
          for check in "Eligibility:$ELIGIBILITY_RESULT" "Formatting and dependencies:$SOURCE_RESULT" "Build and vet:$STATIC_RESULT" "Lint:$LINT_RESULT" "Tests and coverage:$COVERAGE_RESULT" "Race tests:$RACE_RESULT"; do
            name=${check%%:*}
            result=${check#*:}
            if [ "$name" = "Eligibility" ]; then
              expected_for_check=success
            elif [ "$name" = "Tests and coverage" ]; then
              expected_for_check=$expected_coverage
            else
              expected_for_check=$expected
            fi
            if [ "$result" != "$expected_for_check" ]; then
              echo "Required check '$name' concluded: $result; expected $expected_for_check" >&2
              exit 1
            fi
          done
          if [ "$WINDOWS_RESULT" != "success" ] && [ "$WINDOWS_RESULT" != "skipped" ]; then
            echo "Required check 'Native Windows compile and test' concluded: $WINDOWS_RESULT" >&2
            exit 1
          fi
          if [ "$REUSE_RESULT" = "true" ]; then
            echo "Reused exact trusted pull-request validation."
          elif [ "$spec_only" = "true" ]; then
            echo "No Go-relevant file changed; Go validation was not required."
          else
            echo "All required checks passed. This job only combines their results."
          fi

  validation-receipt:
    name: Publish validation receipt
    # `test` deliberately accepts skipped optional jobs. Use !cancelled() so
    # GitHub evaluates this result instead of propagating an ancestor skip.
    # A Go-scoped-out pull request validated nothing, so it must not let the
    # main push reuse it.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' && needs.go-scope.outputs.required == 'true' }}
    needs: [test, go-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Write exact validation receipt
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/ci-reuse-receipt.sh ci-validation-receipt.json
      - name: Upload validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wb-ci-validation-receipt
          path: ci-validation-receipt.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: >-
      ${{
        !cancelled() &&
        needs.test.result == 'success' &&
        needs.release-eligibility.result == 'success' &&
        needs.release-eligibility.outputs.eligible == 'true'
      }}
    needs: [test, release-eligibility]
    # Serialize publication without cancelling a signing/notarization run.
    concurrency:
      group: wb-release-${{ github.ref }}
      cancel-in-progress: false
    # Resolve smoke-test metadata alongside the artifact build, then verify
    # published artifacts and Homebrew installs in parallel after promotion.
    uses: strongo/cicd/.github/workflows/release.yml@19adc5f9e479df1861aea3ee9e1037c746628e4c
    permissions:
      contents: write
    with:
      go_version: '1.27'
      allow_major_version_bump: false
      # A CLI-changing merge without a conventional terminal title must still
      # produce a patch release.
      default_bump: patch
      require_notarized_macos: true
    secrets:
      GORELEASER_GITHUB_TOKEN: ${{ secrets.WB_GORELEASER_GITHUB_TOKEN }}
