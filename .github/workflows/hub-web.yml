name: Hub web CI

on:
  push:
    branches: [main]
    paths:
      - 'hub/web/**'
      - '.github/workflows/hub-web.yml'
  pull_request:
    paths:
      - 'hub/web/**'
      - '.github/workflows/hub-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e
