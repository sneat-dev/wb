name: Hub web CI

on:
  push:
    branches: [main]
    paths:
      - 'hub/web/**'
      - '.github/workflows/hub-web.yml'
      - '.github/actions/playwright-web-setup/**'
  pull_request:
    paths:
      - 'hub/web/**'
      - '.github/workflows/hub-web.yml'
      - '.github/actions/playwright-web-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node, dependencies and Playwright browsers
        uses: ./.github/actions/playwright-web-setup
        with:
          working-directory: hub/web
          node-version: 22
          browsers: chromium webkit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e
