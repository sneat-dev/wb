name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run. Pushing an explicit `vX.Y.Z` tag also works and
# releases that exact version (the shared workflow skips the bump on a tag
# ref). A docs/chore-only merge cuts no tag and publishes nothing.
#
# wb is pre-1.0: allow_major_version_bump stays false, so a stray `feat!:` is
# CAPPED to a minor bump (0.x -> 0.(x+1)) instead of jumping to v1.0.0. Cut
# v1.0.0 deliberately by pushing that tag.
#
# The Homebrew-cask publish step needs sneat-dev/homebrew-tap to exist and a
# WB_GORELEASER_GITHUB_TOKEN secret on this repo — both are manual, one-time
# founder setup. Until they exist, this workflow still builds and creates the
# GitHub Release/binaries successfully; only the cask-publish step fails
# (GoReleaser uploads the release before running publishers).
#
# Token type: a fine-grained PAT scoped to just sneat-dev/homebrew-tap with
# "Contents: Read and write" is sufficient — GoReleaser pushes the cask
# manifest directly to that repo's main branch, no cross-fork PR involved.
# (Sibling CLIs in this ecosystem use a classic public_repo-scoped PAT
# instead, but only because they also publish to WinGet, which requires
# opening a cross-fork PR against microsoft/winget-pkgs — a permission a
# fine-grained PAT can't grant on a third-party repo. wb doesn't publish to
# WinGet/Scoop, so that constraint doesn't apply here; prefer the
# narrower-scoped fine-grained token.)

on:
  push:
    branches:
      - main
    # Only CLI-relevant paths cut releases (sneat-dev/wb#84): the binary is
    # built purely from Go sources (no go:embed of ai/skills/website assets),
    # so website/, docs/, spec/, ai/, skills/, agents/, and examples/ commits
    # must not bump the version or exercise the release pipeline.
    paths:
      - ".github/workflows/release.yml"
      - ".goreleaser.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an immutable tag rather than the floating `v1` of strongo/cicd:
    # `@v1` currently lacks the `macos_signing_preflight` job that implements
    # `require_notarized_macos`, so on that moving tag the flag is a silent
    # no-op. `@v1.14.14` contains both.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.14
    permissions:
      contents: write
    with:
      go_version: '1.27'
      allow_major_version_bump: false
      # WB merger batches can contain several conventional commits. GitHub's
      # terminal squash title is the release parser's only surviving subject;
      # if that title is unexpectedly non-conventional, a CLI-changing push
      # must still publish rather than report a successful no-op.
      default_bump: patch
      # Fail the release if the macOS artifacts aren't signed+notarized. The
      # earlier SIGKILL (exit 137) was misdiagnosed as a Go 1.27 Mach-O issue;
      # the real cause was a .p12 signing bundle rebuilt without the Apple
      # Root CA, which is now fixed (see release_contract_test.go).
      require_notarized_macos: true
    secrets:
      GORELEASER_GITHUB_TOKEN: ${{ secrets.WB_GORELEASER_GITHUB_TOKEN }}
      # macOS signing + notarization secrets, forwarded to activate the
      # `notarize:` block in .goreleaser.yml.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
